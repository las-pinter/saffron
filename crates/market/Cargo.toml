[package]
name = "saffron-market"
description = "Saffron market data: price, FX, and news providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A local stand-in for Yahoo that serves recorded responses, for tests.
test-support = ["dep:axum", "tokio/net", "tokio/rt"]

[dependencies]
axum = { workspace = true, optional = true }
reqwest.workspace = true
rustls.workspace = true
saffron-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true

[dev-dependencies]
saffron-market = { path = ".", features = ["test-support"] }
tokio.workspace = true

[lints]
workspace = true
