name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset on main requires this job by name; keep it `gate`.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: pnpm --dir web install --frozen-lockfile
      # Build the web bundle first so the server tests exercise the embedded app,
      # not only the "not built" answer.
      - run: pnpm --dir web build
      - run: just gate

  # Builds the container and probes it, so a Dockerfile problem shows up in the pull
  # request to main rather than at release time.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t saffron:ci .
      - name: Start the container and wait for healthy
        run: |
          docker run -d --name saffron-ci saffron:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' saffron-ci)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs saffron-ci
          echo "::error::container did not become healthy (last status: $status)"
          exit 1
