[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
ciborium = "0.2.2"
getrandom = "0.4.3"
http-body-util = "0.1.5"
jiff = "1.0.3"
mime_guess = "2.0.5"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rust_decimal = "1.43.0"
rust-embed = "8.14.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
saffron-ai = { path = "crates/ai" }
saffron-core = { path = "crates/core" }
saffron-db = { path = "crates/db" }
saffron-market = { path = "crates/market" }
saffron-mcp = { path = "crates/mcp" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth", "std"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.19.0", features = ["v4"] }
webauthn-rs = { version = "0.6.2", default-features = false, features = ["conditional-ui"] }
webauthn-rs-proto = "0.6.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Line tables keep file and line numbers in backtraces at about half the build size.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
