# Saffron with its data on a named volume.
# The port is published on loopback only: put Tailscale (`tailscale serve`) or a
# reverse proxy with HTTPS in front of it. Do not expose Saffron to the internet.
name: saffron

services:
  saffron:
    image: ghcr.io/las-pinter/saffron:latest
    build: .
    # Build from this checkout. Once releases exist, remove this line and run
    # `docker compose pull` to use the published image instead.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "127.0.0.1:8640:8640"
    environment:
      # The HTTPS URL the browser uses, such as your `tailscale serve` address.
      # Required for any access other than http://localhost:8640: sign-in cookies,
      # the cross-site request check, and passkeys are bound to it.
      # SAFFRON_PUBLIC_URL: "https://saffron.your-tailnet.ts.net"
      #
      # Behind Docker's published port every request arrives from the network
      # gateway. Trust that range so `X-Forwarded-For` from your proxy names the
      # real client; without it, failed sign-ins from anyone throttle everyone.
      # SAFFRON_TRUSTED_PROXIES: "172.16.0.0/12"
      #
      # The installation's time zone: the daily fund price refresh falls due here
      # after 20:00.
      # SAFFRON_TIMEZONE: "Europe/Helsinki"
    volumes:
      - saffron-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  saffron-data:
